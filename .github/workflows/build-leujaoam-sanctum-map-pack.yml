name: Build Leujaoam Sanctum Map Pack

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download and validate maps
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import hashlib, io, json, urllib.request
          from pathlib import Path
          from PIL import Image

          root = Path('Leujaoam_Sanctum_Map_Pack')
          originals = root / 'originals'
          upload = root / 'upload_ready'
          originals.mkdir(parents=True, exist_ok=True)
          upload.mkdir(parents=True, exist_ok=True)
          records = []

          for n in range(1, 11):
              url = f'https://raw.githubusercontent.com/twothreeforme/mediawiki-extension-FFXIMap/master/maps/zones/leujaoam-sanctum_{n}.jpg'
              request = urllib.request.Request(url, headers={'User-Agent': 'Leujaoam-map-pack-builder/1.0'})
              with urllib.request.urlopen(request, timeout=90) as response:
                  data = response.read()
              jpg = originals / f'LeujaoamSanctum{n}.jpg'
              jpg.write_bytes(data)
              with Image.open(io.BytesIO(data)) as im:
                  im.load()
                  if im.format != 'JPEG' or im.size != (512, 512):
                      raise RuntimeError(f'Map {n}: unexpected {im.format} {im.size}')
                  png = upload / f'LeujaoamSanctum{n}.png'
                  im.convert('RGB').save(png, 'PNG', optimize=True)
              records.append({'map': n, 'map_id': 397+n, 'source': url, 'size': [512,512]})

          wiki = ['<div class="toaulive">','{{Construction}}','Coming Soon™... This page contains maps for planned [[Treasures of Aht Urhgan]] [[Assault]] content for HorizonXI.','</div>','<div class="toau assault">','']
          for n in range(1,11):
              wiki += [f'== Map {n} ==', f'[[File:LeujaoamSanctum{n}.png|512px|center]]', '']
          wiki += ['</div>','','[[Category:Maps]]','[[Category:Treasures of Aht Urhgan]]','[[Category:Assault]]','']
          (root/'Leujaoam_Sanctum_Maps.wiki').write_text('\n'.join(wiki), encoding='utf-8')
          (root/'manifest.json').write_text(json.dumps(records, indent=2)+'\n', encoding='utf-8')
          hashes=[]
          for p in sorted(list(originals.iterdir())+list(upload.iterdir())):
              hashes.append(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}')
          (root/'SHA256SUMS.txt').write_text('\n'.join(hashes)+'\n', encoding='utf-8')
          (root/'README.txt').write_text('Ten verified 512x512 Leujaoam Sanctum maps. Upload-ready PNGs are in upload_ready; original JPEGs are in originals. Map IDs are 398-407.\n', encoding='utf-8')
          PY

      - name: Upload map pack
        uses: actions/upload-artifact@v4
        with:
          name: Leujaoam_Sanctum_Map_Pack
          path: Leujaoam_Sanctum_Map_Pack/
          if-no-files-found: error
